<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover (light)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1400px; height: 700px; overflow: hidden; }
  body { font-family: Inter, -apple-system, sans-serif; color: #15161c; position: relative;
         background: radial-gradient(900px 480px at 50% 46%, #eef0ff 0%, rgba(238,240,255,0) 70%), #fbfbfd; }
  #wave { position: absolute; left: 0; right: 0; top: 50%; height: 360px; transform: translateY(-50%);
          display: flex; align-items: center; justify-content: center; gap: 5px; opacity: .28; }
  #wave i { display: block; width: 4px; border-radius: 2px; background: #a9abf5; }
  .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .label { font: 700 15px "JetBrains Mono", monospace; letter-spacing: .22em; text-transform: uppercase; color: #6b6f7c; margin-bottom: 110px; }
  .label b { color: #c2410c; }
  .line { font-size: 50px; font-weight: 600; letter-spacing: -.02em; line-height: 1; white-space: nowrap; color: #8a8c9e; }
  .w { position: relative; display: inline-block; color: #15161c; }
  .w .hl { position: relative; z-index: 1; padding: 0 8px; }
  .w .hl::before { content: ""; position: absolute; inset: -6px 0 -10px; background: rgba(235,104,52,.14); border-bottom: 4px solid #eb6834; border-radius: 6px; z-index: -1; }
  .conf { position: absolute; left: 50%; bottom: calc(100% + 26px); transform: translateX(-50%); white-space: nowrap;
          font: 700 17px "JetBrains Mono", monospace; color: #b4400f; background: #fff; border: 1px solid #f3b394; box-shadow: 0 4px 14px rgba(16,24,40,.08); padding: 7px 12px; border-radius: 9px; }
  .conf::after { content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); border: 7px solid transparent; border-top-color: #f3b394; }
  .meter { display: inline-block; width: 64px; height: 7px; border-radius: 4px; background: #eb6834; vertical-align: 2px; margin-left: 8px; }
  .said { position: absolute; left: 50%; top: calc(100% + 28px); transform: translateX(-50%); white-space: nowrap;
          font: 500 19px "JetBrains Mono", monospace; color: #6b6f7c; }
  .said span { color: #15803d; font-weight: 700; }
  .tag { margin-top: 112px; font-size: 30px; font-weight: 700; letter-spacing: -.01em; color: #15161c; }
  .tag em { font-style: normal; color: #c2410c; }
</style>
</head>
<body>
<div id="wave"></div>
<div class="stage">
  <div class="label">voice agent transcript · <b>café noise</b></div>
  <div class="line">“…three <span class="w"><span class="conf">confidence 1.00<span class="meter"></span></span><span class="hl">handovers</span><span class="said">said: <span>hamburgers</span></span></span>, two fries, and three <span class="w"><span class="conf">confidence 1.00<span class="meter"></span></span><span class="hl">collars</span><span class="said">said: <span>colas</span></span></span>.”</div>
  <div class="tag">Completely sure. <em>Completely wrong.</em></div>
</div>
<script>
  const n = 220;
  document.getElementById("wave").innerHTML = Array.from({ length: n }, (_, i) => {
    const x = i / n, env = Math.sin(Math.PI * x) ** 1.4;
    const h = 12 + env * (60 + 260 * Math.abs(Math.sin(i * 0.37) * Math.cos(i * 0.11)));
    return `<i style="height:${h.toFixed(0)}px"></i>`;
  }).join("");
</script>
</body>
</html>
